<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Waldorf Lorchestoria — Guest Experience</title>

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap');

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
		}

		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			overflow: auto;

			background:
				radial-gradient(circle at 18% 15%,
					#ffffff 0%,
					transparent 34%),
				radial-gradient(circle at 85% 85%,
					#e5ddcf 0%,
					transparent 42%),
				#f5f1e9;

			color: #292622;
			font-family: 'Montserrat', sans-serif;

			transition:
				background 1s ease,
				transform .35s ease;
		}

		body::before,
		body::after {
			content: "";
			position: fixed;
			border-radius: 50%;
			filter: blur(80px);
			pointer-events: none;

			transition:
				background 1s ease,
				opacity 1s ease;
		}

		body::before {
			width: 330px;
			height: 330px;
			top: -120px;
			left: -110px;
			background: #d8c7a9;
			opacity: .38;

			animation:
				floatOne 9s ease-in-out infinite alternate;
		}

		body::after {
			width: 380px;
			height: 380px;
			right: -150px;
			bottom: -160px;
			background: #c8c0b3;
			opacity: .35;

			animation:
				floatTwo 11s ease-in-out infinite alternate;
		}

		@keyframes floatOne {
			to {
				transform: translate(65px, 45px);
			}
		}

		@keyframes floatTwo {
			to {
				transform: translate(-55px, -40px);
			}
		}

		/* CARD */

		.card {
			position: relative;

			width: min(680px, 92vw);

			padding: 65px 55px;

			text-align: center;

			background:
				rgba(255, 255, 255, .73);

			backdrop-filter: blur(22px);
			-webkit-backdrop-filter: blur(22px);

			border: 1px solid rgba(120, 100, 70, .18);

			border-radius: 4px;

			box-shadow:
				0 35px 80px rgba(60, 50, 35, .16),
				0 5px 20px rgba(60, 50, 35, .08),
				inset 0 1px 0 rgba(255, 255, 255, .75);

			z-index: 5;

			animation:
				entrance .9s cubic-bezier(.2, .8, .2, 1);

			transition:
				box-shadow 1s ease,
				border-color 1s ease,
				transform .15s ease;
		}

		@keyframes entrance {
			from {
				opacity: 0;
				transform:
					translateY(28px) scale(.97);
			}

			to {
				opacity: 1;
				transform:
					translateY(0) scale(1);
			}
		}

		/* INNER FRAME */

		.card::before {
			content: "";

			position: absolute;
			inset: 17px;

			border: 1px solid rgba(155, 137, 108, .22);

			pointer-events: none;

			transition:
				inset .5s ease,
				border-color .8s ease;
		}

		.card::after {
			content: "";

			position: absolute;

			top: 17px;
			left: 17px;

			width: 35px;
			height: 35px;

			border-top: 1px solid #9b896c;
			border-left: 1px solid #9b896c;

			pointer-events: none;

			transition:
				width .5s ease,
				height .5s ease,
				border-color .8s ease;
		}

		.corner-bottom {
			position: absolute;

			right: 17px;
			bottom: 17px;

			width: 35px;
			height: 35px;

			border-right: 1px solid #9b896c;
			border-bottom: 1px solid #9b896c;

			transition:
				width .5s ease,
				height .5s ease,
				border-color .8s ease;
		}

		/* LOGO */

		.logo {
			position: relative;
			z-index: 2;

			font-family:
				'Cormorant Garamond',
				Georgia,
				serif;

			font-size:
				clamp(36px, 7vw, 60px);

			line-height: .88;

			font-weight: 500;

			letter-spacing: 4px;

			color: #252321;

			transition:
				color .8s ease,
				letter-spacing .8s ease;
		}

		.logo-small {
			position: relative;
			z-index: 2;

			margin-top: 18px;

			font-size: 11px;

			letter-spacing: 6px;

			color: #8a785f;
		}

		/* DIVIDER */

		.divider {
			display: flex;

			align-items: center;
			justify-content: center;

			gap: 15px;

			margin: 35px 0 30px;
		}

		.divider::before,
		.divider::after {
			content: "";

			width: 70px;
			height: 1px;

			background: #b9aa92;

			transition:
				width .6s ease,
				background .6s ease;
		}

		.diamond {
			width: 7px;
			height: 7px;

			background: #9b896c;

			transform: rotate(45deg);

			transition:
				transform .7s cubic-bezier(.2, .8, .2, 1),
				background .6s ease;
		}

		/* HEADING */

		h1 {
			position: relative;
			z-index: 2;

			margin: 0;

			font-family:
				'Cormorant Garamond',
				Georgia,
				serif;

			font-size: 32px;

			font-weight: 500;

			letter-spacing: .5px;
		}

		.subtitle {
			position: relative;
			z-index: 2;

			margin-top: 12px;

			color: #7c746a;

			font-size: 13px;

			font-weight: 300;

			letter-spacing: 1px;
		}

		/* STARS */

		.stars {
			position: relative;
			z-index: 4;

			display: flex;

			justify-content: center;

			gap: 8px;

			margin: 35px 0 18px;
		}

		.stars span {
			position: relative;

			font-family: Georgia, serif;

			font-size:
				clamp(42px, 9vw, 58px);

			line-height: 1;

			color: #d4cec2;

			cursor: pointer;

			user-select: none;

			transition:
				color .35s ease,
				transform .3s cubic-bezier(.2, .9, .3, 1),
				text-shadow .35s ease;
		}

		.stars span:hover {
			color: #b49b70;

			transform:
				translateY(-6px) scale(1.08);

			text-shadow:
				0 7px 20px rgba(130, 105, 65, .25);
		}

		.stars span.active {
			color: #a88958;

			text-shadow:
				0 2px 13px rgba(150, 120, 65, .28);
		}

		.stars span.active::after {
			content: "";

			position: absolute;

			left: 50%;
			bottom: -2px;

			width: 17px;
			height: 4px;

			transform: translateX(-50%);

			border-radius: 50%;

			background: #b0925d;

			filter: blur(6px);

			opacity: .5;

			animation:
				starGlow 2s ease-in-out infinite;
		}

		@keyframes starGlow {
			50% {
				width: 25px;
				opacity: .75;
			}
		}

		.stars span.pop {
			animation:
				starPop .55s cubic-bezier(.2, 1.5, .4, 1);
		}

		@keyframes starPop {
			0% {
				transform: scale(1);
			}

			45% {
				transform:
					translateY(-7px) scale(1.18);
			}

			75% {
				transform: scale(.96);
			}

			100% {
				transform: scale(1);
			}
		}

		/* OUTPUT */

		#out {
			position: relative;
			z-index: 2;

			min-height: 48px;

			margin-top: 12px;

			font-family:
				'Cormorant Garamond',
				Georgia,
				serif;

			font-size: 22px;

			color: #514737;

			transition:
				color .6s ease;
		}

		#out.change {
			animation:
				outputIn .45s ease;
		}

		@keyframes outputIn {
			from {
				opacity: 0;
				transform: translateY(8px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.rating-number {
			display: block;

			margin-top: 4px;

			font-family: Montserrat, sans-serif;

			font-size: 10px;

			letter-spacing: 3px;

			text-transform: uppercase;

			color: #a08d70;
		}

		/* FEEDBACK INPUT */

		.feedback-input {
			position: relative;
			z-index: 4;

			display: block;

			width: 100%;
			max-width: 400px;
			height: 70px;

			margin: 15px auto 0;
			padding: 12px 15px;

			background: rgba(255, 255, 255, 0.4);

			border: 1px solid rgba(169, 150, 120, 0.3);

			border-radius: 2px;

			font-family: 'Montserrat', sans-serif;

			font-size: 12px;

			color: #514737;

			resize: none;

			outline: none;

			transition:
				background 0.4s ease,
				border-color 0.4s ease,
				box-shadow 0.4s ease;
		}

		.feedback-input::placeholder {
			color: #aaa092;
			font-family: 'Montserrat', sans-serif;
		}

		.feedback-input:focus {
			background: rgba(255, 255, 255, 0.7);

			border-color: #a99678;

			box-shadow:
				0 5px 15px rgba(100, 85, 65, 0.08);
		}

		/* BUTTONS */

		.button-row {
			position: relative;
			z-index: 10;

			display: flex;

			justify-content: center;

			align-items: center;

			gap: 10px;

			flex-wrap: wrap;

			margin-top: 25px;
		}

		#submitReview,
		#again {
			position: relative;
			z-index: 10;

			padding: 13px 28px;

			border: 1px solid #a99678;

			background: rgba(255, 255, 255, .35);

			color: #675a48;

			font-family: Montserrat, sans-serif;

			font-size: 11px;

			letter-spacing: 2px;

			text-transform: uppercase;

			cursor: pointer;

			transition:
				opacity .4s ease,
				background .3s ease,
				color .3s ease,
				transform .3s ease,
				box-shadow .3s ease;
		}

		/* SUBMIT BUTTON IS ALWAYS VISIBLE */

		#submitReview {
			opacity: 1;
			pointer-events: auto;
		}

		#again {
			opacity: 0;
			pointer-events: none;
		}

		#again.show {
			opacity: 1;
			pointer-events: auto;
		}

		#submitReview:hover,
		#again:hover {
			background: #675a48;

			color: white;

			transform: translateY(-2px);

			box-shadow:
				0 8px 20px rgba(80, 65, 45, .14);
		}

		#submitReview:disabled {
			opacity: .6;

			cursor: wait;

			transform: none;
		}

		/* STATUS */

		#submitStatus {
			position: relative;

			z-index: 10;

			min-height: 18px;

			margin-top: 10px;

			font-family: Montserrat, sans-serif;

			font-size: 10px;

			letter-spacing: 1px;

			color: #8a785f;
		}

		/* FOOTER */

		.footer {
			position: relative;
			z-index: 2;

			margin-top: 35px;

			font-size: 9px;

			letter-spacing: 3px;

			text-transform: uppercase;

			color: #aaa092;
		}

		/* RATING STATES */

		.card.low {
			border-color:
				rgba(120, 125, 125, .28);

			box-shadow:
				0 35px 80px rgba(60, 50, 35, .15),
				0 0 35px rgba(100, 110, 110, .08);
		}

		.card.low #out {
			color: #625f59;
		}

		.card.neutral {
			border-color:
				rgba(155, 140, 115, .3);

			box-shadow:
				0 35px 80px rgba(60, 50, 35, .15),
				0 0 35px rgba(160, 140, 105, .08);
		}

		.card.good {
			border-color:
				rgba(170, 145, 95, .42);

			box-shadow:
				0 35px 80px rgba(60, 50, 35, .15),
				0 0 45px rgba(175, 145, 90, .13);
		}

		.card.excellent {
			border-color:
				rgba(175, 143, 82, .58);

			box-shadow:
				0 35px 80px rgba(60, 50, 35, .15),
				0 0 65px rgba(180, 145, 80, .18);
		}

		.card.excellent::before {
			border-color:
				rgba(176, 146, 93, .35);
		}

		.card.excellent::after,
		.card.excellent .corner-bottom {
			border-color: #b0925d;
		}

		.card.excellent .diamond {
			transform:
				rotate(225deg) scale(1.25);

			background: #b0925d;
		}

		.card.excellent .divider::before,
		.card.excellent .divider::after {
			width: 100px;

			background: #b0925d;
		}

		/* CHAOS OVERLAY */

		#chaosLayer {
			position: fixed;

			inset: 0;

			z-index: 200;

			pointer-events: none;

			opacity: 0;

			visibility: hidden;
		}

		#chaosLayer.active {
			opacity: 1;
			visibility: visible;
		}

		.giant-emoji {
			position: absolute;

			left: 50%;
			top: 50%;

			transform:
				translate(-50%, -50%) scale(.2) rotate(-15deg);

			font-size:
				clamp(90px, 18vw, 180px);

			line-height: 1;

			filter:
				drop-shadow(0 15px 15px rgba(0, 0, 0, .18));

			animation:
				giantEmoji 2.4s cubic-bezier(.2, 1.2, .3, 1) forwards;
		}

		@keyframes giantEmoji {

			0% {
				opacity: 0;

				transform:
					translate(-50%, -50%) scale(.1) rotate(-20deg);
			}

			12% {
				opacity: 1;
			}

			25% {
				transform:
					translate(-50%, -50%) scale(1.35) rotate(10deg);
			}

			40% {
				transform:
					translate(-50%, -50%) scale(.95) rotate(-7deg);
			}

			55% {
				transform:
					translate(-50%, -50%) scale(1.05) rotate(4deg);
			}

			75% {
				opacity: 1;
			}

			100% {
				opacity: 0;

				transform:
					translate(-50%, -50%) scale(1.7) rotate(0deg);
			}
		}

		.chaos-title {
			position: absolute;

			top: 12%;
			left: 50%;

			transform:
				translateX(-50%) scale(.5) rotate(-5deg);

			white-space: nowrap;

			font-family:
				'Cormorant Garamond',
				Georgia,
				serif;

			font-size:
				clamp(28px, 6vw, 58px);

			font-weight: 700;

			letter-spacing: 4px;

			color: #292622;

			text-shadow:
				3px 3px 0 white,
				0 10px 25px rgba(0, 0, 0, .12);

			animation:
				chaosTitle 2.3s ease forwards;
		}

		@keyframes chaosTitle {

			0% {
				opacity: 0;

				transform:
					translateX(-50%) scale(.4) rotate(-7deg);
			}

			15% {
				opacity: 1;

				transform:
					translateX(-50%) scale(1.1) rotate(3deg);
			}

			65% {
				opacity: 1;
			}

			100% {
				opacity: 0;

				transform:
					translateX(-50%) scale(1.25) rotate(0);
			}
		}

		.flying-emoji {
			position: absolute;

			left: 50%;
			top: 50%;

			font-size:
				var(--size);

			line-height: 1;

			animation:
				flyEmoji 2.4s cubic-bezier(.12, .8, .25, 1) forwards;

			animation-delay:
				var(--delay);
		}

		@keyframes flyEmoji {

			0% {
				opacity: 0;

				transform:
					translate(-50%, -50%) scale(.2) rotate(0);
			}

			12% {
				opacity: 1;
			}

			45% {
				transform:
					translate(calc(-50% + var(--x)),
						calc(-50% + var(--y))) scale(1.15) rotate(var(--r));
			}

			75% {
				opacity: 1;
			}

			100% {
				opacity: 0;

				transform:
					translate(calc(-50% + var(--x2)),
						calc(-50% + var(--y2))) scale(.65) rotate(var(--r2));
			}
		}

		.chaos-flash {
			position: absolute;

			inset: 0;

			background:
				radial-gradient(circle at center,
					rgba(255, 255, 255, .75),
					transparent 35%);

			opacity: 0;

			animation:
				chaosFlash .65s ease;
		}

		@keyframes chaosFlash {

			0% {
				opacity: 0;
			}

			25% {
				opacity: 1;
			}

			100% {
				opacity: 0;
			}
		}

		body.chaos-shake {
			animation:
				shake .55s ease;
		}

		@keyframes shake {

			0% {
				transform: translate(0);
			}

			20% {
				transform: translate(-5px, 2px);
			}

			40% {
				transform: translate(5px, -2px);
			}

			60% {
				transform: translate(-3px, -1px);
			}

			80% {
				transform: translate(3px, 1px);
			}

			100% {
				transform: translate(0);
			}
		}

		/* MOBILE */

		@media(max-width:600px) {

			.card {
				padding: 50px 25px;
			}

			.stars {
				gap: 4px;
			}

			.stars span {
				font-size: 45px;
			}

			.divider::before,
			.divider::after {
				width: 45px;
			}

			.chaos-title {
				white-space: normal;

				width: 90%;

				text-align: center;
			}

			.button-row {
				flex-direction: column;
			}

			#submitReview,
			#again {
				width: 100%;
				max-width: 260px;
			}
		}
	</style>
</head>


<body>

	<div class="card" id="card">

		<div class="corner-bottom"></div>

		<div class="logo">
			WALDORF<br>
      LORCHESTORIA
    </div>

			<div class="logo-small">
				EST. 2026 · LUXURY · HOSPITALITY
			</div>

			<div class="divider">
				<div class="diamond"></div>
			</div>

			<h1>
				How was your stay?
			</h1>

			<div class="subtitle">
				Your experience matters to us.
			</div>


			<div class="stars">

				<span onclick="rate(1)" onmouseenter="preview(1)">★</span>

				<span onclick="rate(2)" onmouseenter="preview(2)">★</span>

				<span onclick="rate(3)" onmouseenter="preview(3)">★</span>

				<span onclick="rate(4)" onmouseenter="preview(4)">★</span>

				<span onclick="rate(5)" onmouseenter="preview(5)">★</span>

			</div>


			<div id="out">
				Select a rating above
			</div>


			<textarea
      id="feedback"
      class="feedback-input"
      placeholder="Tell us more about your experience..."
    ></textarea>


			<div class="button-row">

				<!-- THIS BUTTON IS ALWAYS VISIBLE -->

				<button
        id="submitReview"
        onclick="submitReview()"
      >
        Submit Review ✦
      </button>


				<button
        id="again"
        onclick="resetRating()"
      >
        Rate Again ↻
      </button>

			</div>


			<div id="submitStatus"></div>


			<div class="footer">
				Thank you for choosing Waldorf Lorchestoria
			</div>

		</div>


		<div id="chaosLayer"></div>


		<script>
			/* =========================================
       YOUR WEB3FORMS ACCESS KEY
       ========================================= */

    const WEB3FORMS_ACCESS_KEY =
      "003cb3db-4401-4a48-bddb-1190c1e99545";


    const card =
      document.getElementById("card");

    const stars =
      document.querySelectorAll(".stars span");

    const output =
      document.getElementById("out");

    const feedbackInput =
      document.getElementById("feedback");

    const again =
      document.getElementById("again");

    const submitButton =
      document.getElementById("submitReview");

    const submitStatus =
      document.getElementById("submitStatus");

    const chaosLayer =
      document.getElementById("chaosLayer");


    let selectedRating = 0;


    const messages = {

      1:
        "We are sorry your experience fell short.",

      2:
        "We hope your next visit is more enjoyable.",

      3:
        "Thank you for your honest feedback.",

      4:
        "Wonderful! We are delighted you enjoyed your stay.",

      5:
        "Absolutely magnificent! Thank you for staying with us."

    };


    /* =========================================
       STAR PREVIEW
       ========================================= */

    function preview(number) {

      if (selectedRating !== 0) {
        return;
      }

      stars.forEach((star, index) => {

        star.classList.toggle(
          "active",
          index < number
        );

      });

    }


    /* =========================================
       STAR RATING
       ========================================= */

    function rate(number) {

      /*
        YOUR ORIGINAL ONE-STAR JOKE
        IS KEPT EXACTLY.
      */

      if (number === 1) {

        alert(
          "You have selected the incorrect amount of stars."
        );

        return;
      }


      selectedRating = number;


      card.classList.remove(
        "low",
        "neutral",
        "good",
        "excellent"
      );


      if (number <= 2) {

        card.classList.add("low");

      }

      else if (number === 3) {

        card.classList.add("neutral");

      }

      else if (number === 4) {

        card.classList.add("good");

      }

      else {

        card.classList.add("excellent");

      }


      stars.forEach((star, index) => {

        star.classList.toggle(
          "active",
          index < number
        );

        star.classList.remove("pop");


        if (index < number) {

          setTimeout(() => {

            star.classList.add("pop");

          }, index * 80);

        }

      });


      output.classList.remove("change");


      setTimeout(() => {

        output.innerHTML =
          messages[number] +
          `
            <span class="rating-number">
              ${number} out of 5 stars
            </span>
          `;

        output.classList.add("change");

      }, 70);


      again.classList.add("show");


      setTimeout(() => {

        dramaticReaction(number);

      }, 180);

    }


    /* =========================================
       SEND REVIEW WITH WEB3FORMS
       ========================================= */

    async function submitReview() {

      if (selectedRating === 0) {

        submitStatus.textContent =
          "Please select a rating first.";

        return;

      }


      submitButton.disabled = true;

      submitButton.textContent =
        "Sending Review...";

      submitStatus.textContent =
        "Sending your review...";


      const formData = new FormData();


      /*
        THIS IS YOUR WEB3FORMS ACCESS KEY
      */

      formData.append(
        "access_key",
        WEB3FORMS_ACCESS_KEY
      );


      /*
        EMAIL SUBJECT
      */

      formData.append(
        "subject",
        "New Waldorf Lorchestoria Guest Review"
      );


      /*
        RATING
      */

      formData.append(
        "rating",
        selectedRating + " out of 5 stars"
      );


      /*
        WRITTEN FEEDBACK
      */

      formData.append(
        "feedback",
        feedbackInput.value.trim() ||
        "No written feedback provided."
      );


      /*
        FULL MESSAGE
      */

      formData.append(
        "message",
        `
WALDORF LORCHESTORIA
Guest Review

Rating:
${selectedRating} out of 5 stars

Guest Feedback:
${feedbackInput.value.trim() || "No written feedback provided."}
        `
      );


      try {

        const response =
          await fetch(
            "https://api.web3forms.com/submit",
            {
              method: "POST",
              body: formData
            }
          );


        const result =
          await response.json();


        if (result.success) {

          submitButton.textContent =
            "Review Sent ✓";

          submitStatus.textContent =
            "Thank you. Your review has been sent.";

          setTimeout(() => {

            resetRating();

          }, 2500);

        }

        else {

          submitButton.disabled = false;

          submitButton.textContent =
            "Submit Review ✦";

          submitStatus.textContent =
            "Something went wrong. Please try again.";

          console.error(result);

        }

      }

      catch (error) {

        console.error(error);

        submitButton.disabled = false;

        submitButton.textContent =
          "Submit Review ✦";

        submitStatus.textContent =
          "Something went wrong. Please try again.";

      }

    }


    /* =========================================
       DRAMATIC REACTION
       ========================================= */

    function dramaticReaction(number) {

      chaosLayer.innerHTML = "";

      chaosLayer.classList.add("active");


      document.body.classList.add(
        "chaos-shake"
      );


      const giant =
        document.createElement("div");

      giant.className =
        "giant-emoji";


      if (number === 2) {

        giant.textContent = "🫠";

      }

      else if (number === 3) {

        giant.textContent = "🤨";

      }

      else if (number === 4) {

        giant.textContent = "💃";

      }

      else {

        giant.textContent = "👑";

      }


      chaosLayer.appendChild(giant);


      const title =
        document.createElement("div");

      title.className =
        "chaos-title";


      if (number === 2) {

        title.textContent =
          "WE HAVE CONCERNS";

      }

      else if (number === 3) {

        title.textContent =
          "INTERESTING";

      }

      else if (number === 4) {

        title.textContent =
          "MAGNIFIQUE";

      }

      else {

        title.textContent =
          "ABSOLUTELY MAGNIFICENT";

      }


      chaosLayer.appendChild(title);


      const flash =
        document.createElement("div");

      flash.className =
        "chaos-flash";

      chaosLayer.appendChild(flash);


      let emojis;


      if (number === 2) {

        emojis = [
          "😬",
          "😭",
          "💀",
          "🫠",
          "😐",
          "🥲",
          "💔"
        ];

      }

      else if (number === 3) {

        emojis = [
          "🤨",
          "😐",
          "🧐",
          "❓",
          "😶",
          "🫥"
        ];

      }

      else if (number === 4) {

        emojis = [
          "✨",
          "💃",
          "🥂",
          "👏",
          "💎",
          "😍",
          "🌟",
          "🎉"
        ];

      }

      else {

        emojis = [
          "👑",
          "💎",
          "✨",
          "🥂",
          "💃",
          "🪩",
          "🌟",
          "😍",
          "🎉",
          "💅"
        ];

      }


      const amount =
        number === 5
          ? 42
          : number === 4
          ? 32
          : 25;


      for (let i = 0; i < amount; i++) {

        const emoji =
          document.createElement("div");


        emoji.className =
          "flying-emoji";


        emoji.textContent =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];


        const angle =
          Math.random() *
          Math.PI * 2;


        const distance =
          130 +
          Math.random() *
          350;


        const distance2 =
          distance +
          100 +
          Math.random() *
          250;


        emoji.style.setProperty(
          "--x",
          Math.cos(angle) *
          distance +
          "px"
        );


        emoji.style.setProperty(
          "--y",
          Math.sin(angle) *
          distance +
          "px"
        );


        emoji.style.setProperty(
          "--x2",
          Math.cos(angle) *
          distance2 +
          "px"
        );


        emoji.style.setProperty(
          "--y2",
          Math.sin(angle) *
          distance2 +
          "px"
        );


        emoji.style.setProperty(
          "--r",
          (Math.random() * 500 - 250) +
          "deg"
        );


        emoji.style.setProperty(
          "--r2",
          (Math.random() * 900 - 450) +
          "deg"
        );


        emoji.style.setProperty(
          "--size",
          (25 + Math.random() * 45) +
          "px"
        );


        emoji.style.setProperty(
          "--delay",
          (Math.random() * .35) +
          "s"
        );


        chaosLayer.appendChild(
          emoji
        );

      }


      setTimeout(() => {

        chaosLayer.classList.remove(
          "active"
        );

        document.body.classList.remove(
          "chaos-shake"
        );

        chaosLayer.innerHTML = "";

      }, 2700);

    }


    /* =========================================
       RESET
       ========================================= */

    function resetRating() {

      selectedRating = 0;

      feedbackInput.value = "";


      stars.forEach(star => {

        star.classList.remove(
          "active",
          "pop"
        );

      });


      card.classList.remove(
        "low",
        "neutral",
        "good",
        "excellent"
      );


      output.innerHTML =
        "Select a rating above";


      output.classList.remove(
        "change"
      );


      again.classList.remove(
        "show"
      );


      submitButton.disabled = false;

      submitButton.textContent =
        "Submit Review ✦";


      submitStatus.textContent = "";

    }


    /* =========================================
       MOUSE TILT
       ========================================= */

    document.addEventListener(
      "mousemove",
      function(e) {

        if (window.innerWidth < 700) {
          return;
        }


        const rect =
          card.getBoundingClientRect();


        const x =
          (e.clientX - rect.left) /
          rect.width -
          .5;


        const y =
          (e.clientY - rect.top) /
          rect.height -
          .5;


        card.style.transform =
          `
            perspective(1000px)
            rotateY(${x * 2}deg)
            rotateX(${-y * 2}deg)
          `;

      }
    );


    card.addEventListener(
      "mouseleave",
      function() {

        card.style.transform =
          "perspective(1000px) rotateY(0deg) rotateX(0deg)";

      }
    );

		</script>
